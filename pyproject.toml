[project]
name = "kernel-voxel-pet"
version = "0.3.0"
description = "Deterministic voxel model and animated sprite renderer for Kernel"
requires-python = ">=3.11,<3.12"
dependencies = ["Pillow==12.3.0", "numpy==1.26.4", "bpy==4.3.0"]

[project.scripts]
kernel-render = "kernel_voxel.render:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kernel_voxel"]

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]
