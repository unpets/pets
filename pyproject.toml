[project]
name = "pets-assets"
version = "0.8.4"
description = "Persona asset generation and Rust core bindings for Pets"
requires-python = ">=3.13,<3.14"
dependencies = ["Pillow==12.3.0", "numpy>=2.0", "bpy==5.2.2"]

[project.scripts]
kernel-render = "kernel_voxel.render:main"
kernel-shimeji = "kernel_voxel.shimeji:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["personas/kernel/blender/kernel_voxel", "crates/pets-core/python/pets_core"]

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]
