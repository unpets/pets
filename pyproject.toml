[project]
name = "kernel-voxel-pet"
version = "0.2.0"
description = "Deterministic voxel model and animated sprite renderer for Kernel"
requires-python = ">=3.11"
dependencies = ["Pillow>=10", "numpy>=2"]

[project.scripts]
kernel-render = "kernel_voxel.render:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kernel_voxel"]
