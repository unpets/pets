[project]
name = "kernel-voxel-pet"
version = "0.5.0"
description = "Deterministic voxel model and animated sprite renderer for Kernel"
requires-python = ">=3.13,<3.14"
dependencies = ["Pillow==12.3.0", "numpy>=2.0", "bpy==5.2.2"]

[project.scripts]
kernel-render = "kernel_voxel.render:main"
kernel-shimeji = "kernel_voxel.shimeji:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kernel_voxel"]

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]
