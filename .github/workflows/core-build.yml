name: Check Studio core build

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-core.ts'
      - 'tests/core-build.mjs'
      - 'crates/pets-core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/core-build.yml'
  pull_request:
    paths:
      - 'scripts/build-core.ts'
      - 'tests/core-build.mjs'
      - 'crates/pets-core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/core-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - name: Check clean and cached WebAssembly builds
        run: bun run test:build-core
