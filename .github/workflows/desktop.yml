name: Build Pets desktop

on:
  workflow_call:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            bundles: nsis
          - os: ubuntu-24.04
            target: linux-x64
            bundles: deb,appimage
          - os: macos-latest
            target: macos-arm64
            bundles: app
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install Rust
        run: rustup update stable --no-self-update
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: pets-desktop-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: pets-desktop-${{ matrix.target }}-
      - uses: actions/download-artifact@v8.0.1
        with:
          name: kernel-viewer-assets
          path: personas/kernel/generated/assets/
      - run: bun install --frozen-lockfile
      - name: Build desktop application
        env:
          BUNDLES: ${{ matrix.bundles }}
        shell: bash
        run: bun run build:desktop --bundles "$BUNDLES" -- --locked
      - name: Collect platform packages
        env:
          DESKTOP_TARGET: ${{ matrix.target }}
        run: bun scripts/package-desktop.ts
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: pets-desktop-${{ matrix.target }}
          path: desktop-packages/
          if-no-files-found: error
