name: Release Pets

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['pyproject.toml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pets-release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      states: ${{ steps.version.outputs.states }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install locked dependencies
        run: |
          uv sync --frozen
          bun install --frozen-lockfile
      - name: Validate release version
        id: version
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [[ "$RELEASE_REF" == refs/tags/* ]]; then
            uv run python scripts/release.py check --tag "${RELEASE_REF#refs/tags/}"
          else
            uv run python scripts/release.py check
          fi
      - name: Check source and rig
        run: |
          uv run ruff check personas/kernel/blender crates/pets-core/python scripts tests
          uv run ruff format --check personas/kernel/blender crates/pets-core/python scripts tests
          uv run python -m unittest discover -s tests -v
          cargo fmt --all --check
          cargo test -p pets-core --all-features --locked
          bun run format:check
          bun run check
      - name: Build the core export executable
        run: |
          cargo build -p pets-core --features cli --bin pets-export --locked
          strip target/debug/pets-export
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: pets-core-export
          path: target/debug/pets-export
          if-no-files-found: error
          retention-days: 7
      - name: Restore Blender source cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            build/kernel.blend
            build/blend-screens/
            build/timeline.json
            build/blend-check.json
            build/model-cache.json
          key: kernel-source-${{ runner.os }}-${{ hashFiles('personas/kernel/blender/**', 'uv.lock', 'pyproject.toml') }}
          restore-keys: kernel-source-${{ runner.os }}-
      - name: Build and verify the canonical Blender source
        run: uv run kernel-render --model-only --output build
      - name: Verify composition playback and baking
        run: uv run python scripts/verify_compositions.py --blend build/kernel.blend
      - name: Export shared viewer assets
        run: uv run kernel-render --site-only --blend build/kernel.blend --site-output personas/kernel/generated
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: kernel-viewer-assets
          path: personas/kernel/generated/assets/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: kernel-source
          path: |
            build/kernel.blend
            build/blend-screens/
            build/timeline.json
            build/blend-check.json
            build/model-cache.json
          if-no-files-found: error
          retention-days: 7

  desktop:
    needs: check
    uses: ./.github/workflows/desktop.yml

  render:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        state: ${{ fromJSON(needs.check.outputs.states) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - uses: actions/download-artifact@v8.0.1
        with:
          name: kernel-source
          path: build/
      - name: Restore animation frame cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            build/frames/${{ matrix.state }}/
            build/masters/${{ matrix.state }}/
            build/render-${{ matrix.state }}.json
          key: kernel-frames-${{ runner.os }}-${{ matrix.state }}-${{ hashFiles('personas/kernel/blender/**', 'uv.lock', 'pyproject.toml') }}
          restore-keys: kernel-frames-${{ runner.os }}-${{ matrix.state }}-
      - name: Render state from the Blender model
        env:
          ANIMATION_STATE: ${{ matrix.state }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '4'
        run: uv run kernel-render --render-only --blend build/kernel.blend --states "$ANIMATION_STATE" --output build
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: kernel-frames-${{ matrix.state }}
          path: |
            build/frames/
            build/masters/
            build/render-*.json
          if-no-files-found: error
          retention-days: 7

  package:
    needs: [check, render, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PETS_EXPORT_BIN: ${{ github.workspace }}/.tools/pets-export
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install locked dependencies
        run: |
          uv sync --frozen
          bun install --frozen-lockfile
      - uses: actions/download-artifact@v8.0.1
        with:
          name: pets-core-export
          path: .tools/
      - name: Enable the core export executable
        run: chmod +x "$PETS_EXPORT_BIN"
      - uses: actions/download-artifact@v8.0.1
        with:
          name: kernel-source
          path: build/
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: kernel-frames-*
          merge-multiple: true
          path: build/
      - uses: actions/download-artifact@v8.0.1
        with:
          name: kernel-viewer-assets
          path: personas/kernel/generated/assets/
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: pets-desktop-*
          merge-multiple: true
          path: desktop-packages/
      - name: Assemble sprites and Shimeji package
        run: |
          uv run kernel-render --assemble-only --output build
          uv run kernel-shimeji --build build --output build-shimeji
      - name: Build and test the static site
        run: |
          bun test
          bun run build
          bun run build:pet
          bunx playwright install --with-deps chromium firefox
          bun run test:viewer
          bun run test:pet
          bun run test:animation
          bun run test:studio
          xvfb-run -a env PLAYWRIGHT_BROWSER=firefox bun run test:viewer
      - name: Package versioned downloads
        env:
          RELEASE_TAG: ${{ needs.check.outputs.tag }}
        run: uv run python scripts/release.py bundle --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: pets-release-${{ needs.check.outputs.version }}
          path: release/
          if-no-files-found: error
      - name: Upload the tested release site
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist/

  publish:
    needs: [check, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: pets-release-${{ needs.check.outputs.version }}
          path: release/
      - name: Verify download checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Ensure the release tag matches the verified build
        uses: actions/github-script@v9.0.0
        env:
          RELEASE_TAG: ${{ needs.check.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
        with:
          script: |
            const fs = require('node:fs');
            const tag = process.env.RELEASE_TAG;
            const sha = process.env.RELEASE_SHA;
            const manifest = JSON.parse(fs.readFileSync('release/release.json', 'utf8'));
            if (`v${manifest.version}` !== tag || manifest.commit !== sha) {
              throw new Error('Release packages do not match the selected version and commit.');
            }
            let object;
            try {
              const {data} = await github.rest.git.getRef({...context.repo, ref: `tags/${tag}`});
              object = data.object;
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({...context.repo, ref: `refs/tags/${tag}`, sha});
              core.info(`Created ${tag} at the verified commit ${sha}.`);
              return;
            }
            while (object.type === 'tag') {
              const {data} = await github.rest.git.getTag({...context.repo, tag_sha: object.sha});
              object = data.object;
            }
            if (object.type !== 'commit' || object.sha !== sha) {
              throw new Error(`${tag} already points to another commit; refusing to move it.`);
            }
      - name: Publish the complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.check.outputs.tag }}
        run: |
          if existing=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$existing" != true ]]; then
              echo "Release $RELEASE_TAG is already published; refusing to replace it."
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "Pets $RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest

  deploy:
    needs: [package, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the released static site
        id: deployment
        uses: actions/deploy-pages@v5.0.1
