name: Build Kernel model studio

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install locked dependencies
        run: |
          uv sync --frozen
          bun install --frozen-lockfile
      - name: Test rig, screen and transparency
        run: |
          uv run ruff check kernel_voxel scripts tests
          uv run ruff format --check kernel_voxel scripts tests
          uv run python -m unittest discover -s tests -v
      - name: Generate model and animation assets
        run: bun run generate
      - name: Test generated assets
        run: bun test
      - name: Check Svelte and TypeScript
        run: |
          bun run format:check
          bun run check
      - name: Build the Svelte site
        run: bun run build
      - name: Browser checks
        run: |
          bunx playwright install --with-deps chromium firefox
          bun run test:viewer
          xvfb-run -a env PLAYWRIGHT_BROWSER=firefox bun run test:viewer
      - name: Save generated site
        uses: actions/upload-artifact@v7.0.1
        with:
          name: kernel-model-studio
          path: dist/
