name: Build Pets studio

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  target:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.target.outputs.release }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
      - id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == push ]] && git diff --name-only HEAD^ HEAD | grep -qx pyproject.toml; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  studio:
    needs: target
    if: needs.target.outputs.release != 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install locked dependencies
        run: |
          uv sync --frozen
          bun install --frozen-lockfile
      - name: Test rig, screen and transparency
        run: |
          uv run ruff check personas/kernel/blender crates/pets-core/python scripts tests
          uv run ruff format --check personas/kernel/blender crates/pets-core/python scripts tests
          uv run python -m unittest discover -s tests -v
      - name: Restore model and viewer cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            build/environment.blend
            build/environment.json
            build/kernel.blend
            build/blend-screens/
            build/timeline.json
            build/blend-check.json
            build/model-cache.json
            personas/kernel/generated/assets/
            personas/kernel/generated/site-cache.json
          key: kernel-studio-${{ runner.os }}-${{ hashFiles('resources/environment.json', 'personas/kernel/blender/**', 'uv.lock', 'pyproject.toml') }}
          restore-keys: kernel-studio-${{ runner.os }}-
      - name: Generate model and animation assets
        run: bun run generate
      - name: Verify composition playback and baking
        run: uv run python scripts/verify_compositions.py --blend build/kernel.blend
      - name: Test generated assets
        run: bun test
      - name: Check Svelte and TypeScript
        run: |
          cargo fmt --all --check
          cargo test -p pets-core --all-features --locked
          bun run format:check
          bun run check
      - name: Build the Svelte site
        run: |
          bun run build
          bun run build:pet
      - name: Browser checks
        run: |
          bunx playwright install --with-deps chromium firefox
          bun run test:viewer
          bun run test:pet
          bun run test:animation
          bun run test:studio
          bun run test:personas
          bun run test:gaze
          bun run test:studio-ui
          bun run test:environment
          bun run test:locomotion
          xvfb-run -a env PLAYWRIGHT_BROWSER=firefox bun run test:viewer
      - name: Save generated site
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pets-studio
          path: dist/
      - name: Save shared desktop assets
        uses: actions/upload-artifact@v7.0.1
        with:
          name: kernel-viewer-assets
          path: personas/kernel/generated/assets/
          if-no-files-found: error

  desktop:
    if: github.event_name != 'push'
    needs: studio
    uses: ./.github/workflows/desktop.yml

