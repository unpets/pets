[workspace]
members = ["crates/pets-core", "apps/desktop/src-tauri"]
default-members = ["crates/pets-core"]
resolver = "3"

[workspace.package]
version = "0.8.5"
edition = "2024"
rust-version = "1.90"
authors = ["Gabriel Grondin"]
repository = "https://github.com/GGLinnk/pets"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
pets-core = { path = "crates/pets-core" }
